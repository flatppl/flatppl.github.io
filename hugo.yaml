# FlatPPL landing page. Content lives in content/_index.md; the theme is
# Hextra (themes/hextra, git submodule pinned to a release tag).
baseURL: "https://flatppl.org/"
title: "FlatPPL"
theme: hextra
enableRobotsTXT: true
enableEmoji: true
disableKinds: ["taxonomy", "term", "rss"]

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - name: Specification
      url: https://spec.flatppl.org/
      weight: 1
    - name: Playground
      url: https://live.flatppl.org/
      weight: 2
    - name: GitHub
      url: https://github.com/flatppl
      weight: 3
      params:
        icon: github
    - name: Theme
      weight: 4
      params:
        type: theme-toggle

params:
  description: "FlatPPL, the Flat Portable Probabilistic Language: a minimal, inference-agnostic language for specifying probabilistic models."
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo.png
      width: 32
      height: 32
  theme:
    default: system
    # The toggle lives in the navbar (menu entry of type theme-toggle);
    # this switches off the theme's duplicate in the footer.
    displayToggle: false
  page:
    width: wide
  search:
    enable: false
  footer:
    displayCopyright: false
    displayPoweredBy: false

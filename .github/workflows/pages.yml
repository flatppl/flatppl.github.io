name: Build and deploy site

# Builds the landing page with Hugo on every push and pull request, and
# deploys it to GitHub Pages on pushes to main. The repository's Pages
# settings must select "GitHub Actions" as the deploy source (one-time,
# manual). The custom domain is configured in the same settings page, not
# in this repository, so no CNAME file is needed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The Hextra theme is a git submodule under themes/.
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Fetches the pinned release the Hugo project publishes itself and
      # verifies it against the SHA-256 from that release's checksum file
      # (hugo_<version>_checksums.txt) before installing. Bumping Hugo means
      # updating both values.
      - name: Install Hugo (extended)
        env:
          HUGO_VERSION: '0.165.0'
          HUGO_SHA256: 'f43494894cdf4a8630a201d5c828051c77f523cc66bb3938b30806835470ac20'
        run: |
          set -euo pipefail
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${archive}"
          echo "${HUGO_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/hugo"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/hugo" hugo
          echo "${RUNNER_TEMP}/hugo" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/hugo/hugo" version

      # Resolves the URL the site is actually served from (the custom domain
      # once configured, the github.io address before that). Skipped on pull
      # requests, where the read-only token cannot query Pages settings.
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Build site
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url || 'https://flatppl.org' }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

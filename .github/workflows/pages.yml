name: Build and deploy site

# Builds the landing page with Bun on every push and pull request, and
# deploys it to GitHub Pages on pushes to main. The repository's Pages
# settings must select "GitHub Actions" as the deploy source (one-time,
# manual). The custom domain is configured in the same settings page, not
# in this repository, so no CNAME file is needed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check site
        run: |
          bun run test
          bun run typecheck
          bun run verify-theme
          bun run htmlcheck
          bun run linkcheck

      # Resolves the URL the site is actually served from (the custom domain
      # once configured, the github.io address before that). Skipped on pull
      # requests, where the read-only token cannot query Pages settings.
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Build site
        run: bun run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
